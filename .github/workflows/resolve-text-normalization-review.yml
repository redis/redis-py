name: Resolve text normalization review

on:
  push:
    branches:
      - fix/function-load-library-metadata-3307

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/function-load-library-metadata-3307

      - name: Apply text allocation and documentation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          helpers_path = Path("redis/commands/helpers.py")
          helpers = helpers_path.read_text()
          if "import re\n" not in helpers:
              helpers = helpers.replace("import random\n", "import random\nimport re\n", 1)

          start = helpers.index("def _normalize_function_lib_code_text(text: str) -> str:\n")
          new_tail = r'''_FUNCTION_LIB_TEXT_TERMINATOR_RE = re.compile(
              r"\A(?P<leading>[ \t\n\r\v\f]*)(?P<header>.*?)(?P<terminator>\\r\\n|\\n\r?|\r\n|\n|\r)",
              re.DOTALL,
          )


def _normalize_function_lib_code_text(text: str) -> str:
              """Normalize only the text shebang framing in one regex pass."""
              match = _FUNCTION_LIB_TEXT_TERMINATOR_RE.match(text)
              if match is None:
                  return text.lstrip()

              terminator = match.group("terminator")
              if not match.group("leading") and terminator == "\n":
                  return text

              header = match.group("header")
              # The regex engine copies the unmatched body directly into the final
              # result, avoiding a separate payload-sized suffix slice.
              return _FUNCTION_LIB_TEXT_TERMINATOR_RE.sub(
                  lambda _match: header + "\n", text, count=1
              )
          '''
          # Remove indentation introduced only for this workflow heredoc.
          new_tail = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_tail.splitlines()
          ) + "\n"
          helpers_path.write_text(helpers[:start] + new_tail)

          core_path = Path("redis/commands/core.py")
          core = core_path.read_text()
          old = '''            shebang terminator is a redis-cli-style ``\\\\n`` or ``\\\\r\\\\n``
              escape instead of a real newline, that terminator is expanded even
              when the body contains later physical newlines. Later escapes in
              the body (e.g. Lua string escapes) are left unchanged.
          '''
          new = '''            shebang terminator is a redis-cli-style ``\\\\n`` or ``\\\\r\\\\n``
              escape, it is expanded even when the body contains later physical
              newlines. Physical CRLF and lone-CR shebang terminators are also
              normalized to LF. Later escapes and line endings in the body are
              left unchanged.
          '''
          if old not in core:
              raise SystemExit("Expected function_load docstring block not found")
          core_path.write_text(core.replace(old, new, 1))
          PY

      - name: Install focused test dependencies
        run: python -m pip install -e . pytest

      - name: Run focused helper tests
        run: python -m pytest tests/test_helpers.py -q

      - name: Remove workflow and amend commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/resolve-text-normalization-review.yml
          git add redis/commands/helpers.py redis/commands/core.py .github/workflows/resolve-text-normalization-review.yml
          git commit --amend -m "perf: normalize function source without large text copies"
          git push --force-with-lease origin HEAD:fix/function-load-library-metadata-3307
